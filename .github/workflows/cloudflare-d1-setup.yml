name: Cloudflare D1 Setup

on:
  workflow_dispatch:
    inputs:
      create_database:
        description: "Create the aims_lms D1 database. Run once only."
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      apply_migrations:
        description: "Apply migrations to the remote aims_lms D1 database."
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      promote_admin_email:
        description: "Optional email to promote to active admin after that user signs up."
        required: false
        default: ""

jobs:
  setup-d1:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create D1 database
        if: ${{ inputs.create_database == 'true' }}
        run: npx --yes wrangler@4 d1 create aims_lms

      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations == 'true' }}
        run: npx --yes wrangler@4 d1 migrations apply aims_lms --remote

      - name: Build admin promotion SQL
        if: ${{ inputs.promote_admin_email != '' }}
        id: admin_sql
        env:
          ADMIN_EMAIL: ${{ inputs.promote_admin_email }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          email = os.environ['ADMIN_EMAIL'].replace("'", "''").strip().lower()
          print("sql=UPDATE users SET role='admin', status='active' WHERE lower(email)='{}';".format(email))
          PY

      - name: Promote admin user
        if: ${{ inputs.promote_admin_email != '' }}
        env:
          ADMIN_SQL: ${{ steps.admin_sql.outputs.sql }}
        run: npx --yes wrangler@4 d1 execute aims_lms --remote --command "$ADMIN_SQL"
